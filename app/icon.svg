<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: the Movingo mark — a house whose inner stroke reads as an "M"
       — over the site's own bloom wash. The blooms are plain radial
       gradients rather than blurred shapes: a favicon is rasterised down to
       16px, where a Gaussian blur costs render time and buys nothing, while
       a gradient fading to transparent is already soft.

       The mark is drawn at stroke-width 4 on a 64 viewBox (the same 2-on-32
       ratio as components/Logo.tsx). Finer detail — window dots, a lighter
       inner stroke — was tried and fills in solid at 16px, so the drawing
       stops at two paths. -->
  <defs>
    <radialGradient id="peach" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6bf98" stop-opacity="1" />
      <stop offset="100%" stop-color="#f6bf98" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f19c8c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f19c8c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lavender" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8ade8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b8ade8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab6ea" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8ab6ea" stop-opacity="0" />
    </radialGradient>
    <clipPath id="rounded">
      <rect width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="64" height="64" fill="#ffffff" />
    <ellipse cx="36" cy="42" rx="42" ry="28" fill="url(#peach)" />
    <ellipse cx="52" cy="22" rx="30" ry="24" fill="url(#rose)" />
    <ellipse cx="18" cy="24" rx="28" ry="24" fill="url(#lavender)" />
    <ellipse cx="8" cy="54" rx="28" ry="22" fill="url(#sky)" />
  </g>

  <g fill="none" stroke="#17191c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 28.4 32 12l21 16.4V53H11z" />
    <path d="M22 53V32.5l10 8.5 10-8.5V53" />
  </g>
</svg>
